spring:
  application:
    name: ms-barriodigital-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # reintentos locales antes de dejar que el dead-lettering de la cola actue;
        # ademas de esto, RabbitMQ reenvia a la DLQ si el listener lanza excepcion.
        retry:
          enabled: true
          max-attempts: 3

barriodigital:
  rabbitmq:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    colas:
      email: q.cmd.email
      email-dlq: q.cmd.email.dlq
      crew: q.cmd.crew
      crew-dlq: q.cmd.crew.dlq
      certificate: q.cmd.certificate
      certificate-dlq: q.cmd.certificate.dlq
    routing-keys:
      email-send: email.send
      email-topic: "email.*"
      email-dlq: email.dlq
      crew-ticket: crew.ticket
      crew-topic: "crew.#"
      crew-dlq: crew.dlq
      certificate-gen: certificate.gen
      certificate-topic: "certificate.*"
      certificate-dlq: certificate.dlq
