spring:
  application:
    name: ms-barriodigital-notify
  rabbitmq:
    # failover del cliente (C8): en AWS RABBITMQ_ADDRESSES=10.0.1.254:5672,10.0.1.254:5673 (nodo 1 y 2).
    # Sin esa variable cae a host:port, asi que local no cambia.
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # ACK manual (ver AckManual): cada listener decide ack / nack-requeue / nack-DLQ.
        # Sin requeue por defecto: un rechazo no declarado va a la DLQ, nunca en bucle.
        acknowledge-mode: manual
        default-requeue-rejected: false

barriodigital:
  rabbitmq:
    # entregas maximas de un comando con error recuperable antes de mandarlo a la DLQ
    max-intentos: 3
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    colas:
      email: q.cmd.email
      email-dlq: q.cmd.email.dlq
      crew: q.cmd.crew
      crew-dlq: q.cmd.crew.dlq
      certificate: q.cmd.certificate
      certificate-dlq: q.cmd.certificate.dlq
    routing-keys:
      email-send: email.send
      email-topic: "email.*"
      email-dlq: email.dlq
      crew-ticket: crew.ticket
      crew-topic: "crew.#"
      crew-dlq: crew.dlq
      certificate-gen: certificate.gen
      certificate-topic: "certificate.*"
      certificate-dlq: certificate.dlq
